<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบบันทึกคลังอุปกรณ์สำนักงาน (OED Online)</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Firebase SDK (โหลดเวอร์ชัน 8) -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

  <style>
    body { font-family: 'Sarabun', sans-serif; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>

  <script>
    // การตั้งค่า Firebase ของโปรเจกต์ OED Office Supplies Inventory
    const firebaseConfig = {
      apiKey: "AIzaSyDWbPhrbNRu4uqNltocOUGJLJGMyEiMPyc",
      authDomain: "oed-office-supplies-inve-7e082.firebaseapp.com",
      projectId: "oed-office-supplies-inve-7e082",
      storageBucket: "oed-office-supplies-inve-7e082.firebasestorage.app",
      messagingSenderId: "262342434170",
      appId: "1:262342434170:web:5e48e1d6b51261e8ce4ac3"
    };

    // Initialize Firebase
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();
  </script>
</head>
<body class="bg-slate-50 text-slate-800">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const categoryPrefixMap = {
      "กระดาษและสิ่งพิมพ์": "AA",
      "เครื่องเขียน": "BB",
      "อุปกรณ์สำนักงาน": "CC",
      "อุปกรณ์ไอทีและคอมพิวเตอร์": "DD",
      "ของใช้ทำความสะอาดและเบ็ดเตล็ด": "EE"
    };

    const categoryIconMap = {
      "กระดาษและสิ่งพิมพ์": "📄",
      "เครื่องเขียน": "✏️",
      "อุปกรณ์สำนักงาน": "📎",
      "อุปกรณ์ไอทีและคอมพิวเตอร์": "💻",
      "ของใช้ทำความสะอาดและเบ็ดเตล็ด": "🧹"
    };

    function getNowDateTimeLocal() {
      const now = new Date();
      now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
      return now.toISOString().slice(0, 16);
    }

    function generateNextId(category, currentInventory) {
      const prefix = categoryPrefixMap[category] || "XX";
      const itemsInCat = currentInventory.filter(item => item.id.startsWith(prefix));
      if (itemsInCat.length === 0) return `${prefix}001`;
      const nums = itemsInCat.map(item => {
        const numPart = item.id.replace(prefix, "");
        return parseInt(numPart, 10);
      }).filter(n => !isNaN(n));
      const nextNum = nums.length > 0 ? Math.max(...nums) + 1 : 1;
      return `${prefix}${String(nextNum).padStart(3, '0')}`;
    }

    const formatB = (num) => new Intl.NumberFormat('th-TH', { style: 'currency', currency: 'THB', minimumFractionDigits: 0 }).format(num);
    const formatNum = (num) => new Intl.NumberFormat('th-TH').format(num);

    function App() {
      const [inventory, setInventory] = useState([]);
      const [transactions, setTransactions] = useState([]);
      const [monthlyBudget, setMonthlyBudget] = useState(10000);
      
      // State เพื่อเช็กว่ากำลังโหลดข้อมูลจากฐานข้อมูลอยู่หรือไม่
      const [isLoading, setIsLoading] = useState(true);
      const [dbError, setDbError] = useState(false); // เช็ก error

      const [activeTab, setActiveTab] = useState("stock");
      const [searchTerm, setSearchTerm] = useState("");
      const [filterCategory, setFilterCategory] = useState("ทั้งหมด");
      const [onlyLowStock, setOnlyLowStock] = useState(false);
      const [txnSearchTerm, setTxnSearchTerm] = useState("");
      const [txnFilterCategory, setTxnFilterCategory] = useState("ทั้งหมด");
      const [kpiCategory, setKpiCategory] = useState("ทั้งหมด");

      const today = new Date().toISOString().slice(0, 10);
      const thirtyDaysAgo = new Date(Date.now() - 30 * 24 * 60 * 60 * 1000).toISOString().slice(0, 10);
      const [startDate, setStartDate] = useState(thirtyDaysAgo);
      const [endDate, setEndDate] = useState(today);

      const [isDetailModalOpen, setIsDetailModalOpen] = useState(false);
      const [detailItem, setDetailItem] = useState(null);
      const [isAddEditModalOpen, setIsAddEditModalOpen] = useState(false);
      const [isEditing, setIsEditing] = useState(false);
      const [editingOldId, setEditingOldId] = useState("");

      const [isActionModalOpen, setIsActionModalOpen] = useState(false);
      const [selectedItem, setSelectedItem] = useState(null);
      const [actionType, setActionType] = useState("out");
      const [actionQty, setActionQty] = useState(1);
      const [actionPrice, setActionPrice] = useState(0);
      const [actionDate, setActionDate] = useState(getNowDateTimeLocal());
      const [actionUser, setActionUser] = useState(""); 
      const [actionNote, setActionNote] = useState("");

      const [isBudgetModalOpen, setIsBudgetModalOpen] = useState(false);
      const [tempBudget, setTempBudget] = useState(monthlyBudget);

      const [formData, setFormData] = useState({ 
        id: "", name: "", category: "กระดาษและสิ่งพิมพ์", stock: 0, reorder: 5, unit: "ชิ้น", price: 0, location: "", image: "", receivedDate: today 
      });

      // 🟢 เชื่อมต่อ Firebase Real-time Listener 🟢
      useEffect(() => {
        setIsLoading(true);
        // ฟังข้อมูล Inventory
        const unsubInv = db.collection("inventory").onSnapshot(
          (snapshot) => {
            const items = [];
            snapshot.forEach((doc) => items.push({ ...doc.data(), docId: doc.id }));
            
            // เรียงลำดับข้อมูลตามรหัส (AA001, BB001) ก่อนนำไปแสดงผล
            items.sort((a, b) => a.id.localeCompare(b.id));
            setInventory(items);
            setIsLoading(false);
          },
          (error) => {
            console.error("Firestore error: ", error);
            setDbError(true);
            setIsLoading(false);
          }
        );

        // ฟังข้อมูล Transactions เรียงตามเวลาล่าสุด
        const unsubTxn = db.collection("transactions").orderBy("timestamp", "desc").onSnapshot(
          (snapshot) => {
            const txns = [];
            snapshot.forEach((doc) => txns.push({ ...doc.data(), docId: doc.id }));
            setTransactions(txns);
          },
          (error) => console.error("Firestore txn error: ", error)
        );

        // ฟังค่างบประมาณ
        const unsubBudget = db.collection("settings").doc("budget").onSnapshot((doc) => {
          if (doc.exists) {
            setMonthlyBudget(doc.data().amount);
            setTempBudget(doc.data().amount);
          }
        });

        return () => { unsubInv(); unsubTxn(); unsubBudget(); };
      }, []);

      // 🟢 ฟังก์ชันบันทึกอุปกรณ์ใหม่/แก้ไข ลง Firebase 🟢
      const handleSaveItem = async (e) => {
        e.preventDefault();
        const trimmedId = formData.id.trim().toUpperCase();
        if (!trimmedId) { alert("กรุณาระบุรหัสอุปกรณ์"); return; }

        if (!isEditing || (isEditing && trimmedId !== editingOldId)) {
          const duplicate = inventory.some(item => item.id.toUpperCase() === trimmedId);
          if (duplicate) { alert(`รหัสอุปกรณ์ "${trimmedId}" นี้มีอยู่ในระบบแล้ว`); return; }
        }

        try {
          if (isEditing) {
            const oldItem = inventory.find(i => i.id === editingOldId);
            if (oldItem && oldItem.docId) {
              await db.collection("inventory").doc(oldItem.docId).update({
                id: trimmedId,
                name: formData.name,
                category: formData.category,
                stock: Number(formData.stock),
                reorder: Number(formData.reorder),
                price: Number(formData.price),
                unit: formData.unit,
                location: formData.location,
                image: formData.image,
                receivedDate: formData.receivedDate
              });
            }
          } else {
            await db.collection("inventory").add({
              id: trimmedId,
              name: formData.name,
              category: formData.category,
              stock: Number(formData.stock),
              reorder: Number(formData.reorder),
              price: Number(formData.price),
              unit: formData.unit,
              location: formData.location,
              image: formData.image,
              receivedDate: formData.receivedDate
            });
          }
          setIsAddEditModalOpen(false);
        } catch (error) {
          alert("เกิดข้อผิดพลาด: ไม่สามารถบันทึกได้ โปรดตรวจสอบว่าเปิด Firestore Database และตั้งค่า Rules เป็น true หรือยัง");
          console.error(error);
        }
      };

      // 🟢 ฟังก์ชันรับเข้า/เบิกออก ลง Firebase 🟢
      const handleTransactionSubmit = async (e) => {
        e.preventDefault();
        const qty = Number(actionQty);
        const pPrice = Number(actionPrice);
        if (qty <= 0) return;
        if (actionType === "out" && qty > selectedItem.stock) { alert("เบิกเกินจำนวนที่มีไม่ได้"); return; }
        if (!actionUser.trim()) { alert("กรุณาระบุชื่อผู้ทำรายการ"); return; }

        const newStock = actionType === "in" ? selectedItem.stock + qty : selectedItem.stock - qty;
        
        try {
          // อัปเดตสต็อก
          await db.collection("inventory").doc(selectedItem.docId).update({
            stock: newStock,
            price: actionType === "in" && pPrice > 0 ? pPrice : selectedItem.price,
            receivedDate: actionType === "in" ? actionDate.slice(0, 10) : selectedItem.receivedDate
          });

          const chosenDate = new Date(actionDate);
          const formattedDate = isNaN(chosenDate) ? new Date().toLocaleString("th-TH") : (chosenDate.toLocaleDateString("th-TH") + " " + chosenDate.toLocaleTimeString("th-TH", { hour: '2-digit', minute: '2-digit' }) + " น.");
          
          // บันทึกประวัติ
          await db.collection("transactions").add({
            timestamp: actionDate,
            dateStr: formattedDate,
            itemId: selectedItem.id,
            itemName: selectedItem.name,
            type: actionType === "in" ? "รับเข้า" : "เบิกออก",
            qty: qty,
            unit: selectedItem.unit,
            price: actionType === "in" ? pPrice : selectedItem.price,
            totalCost: actionType === "in" ? (qty * pPrice) : 0,
            user: actionUser.trim(),
            note: actionNote.trim() || "-"
          });

          setIsActionModalOpen(false);
        } catch (error) {
          alert("เกิดข้อผิดพลาดในการทำรายการ");
          console.error(error);
        }
      };

      // 🟢 ฟังก์ชันลบประวัติ ลง Firebase 🟢
      const handleDeleteTransaction = async (txnId) => {
        const txnToDelete = transactions.find(t => t.docId === txnId);
        if (!txnToDelete) return;
        if (!window.confirm(`ยืนยันการลบรายการ: "${txnToDelete.type} ${txnToDelete.itemName}"?\n*ระบบจะคืนค่าสต็อกคงเหลือให้อัตโนมัติ*`)) return;

        try {
          const item = inventory.find(i => i.id === txnToDelete.itemId);
          if (item) {
            let adjustedStock = item.stock;
            if (txnToDelete.type === "เบิกออก") adjustedStock += txnToDelete.qty;
            else if (txnToDelete.type === "รับเข้า") adjustedStock = Math.max(0, adjustedStock - txnToDelete.qty);
            
            await db.collection("inventory").doc(item.docId).update({ stock: adjustedStock });
          }
          await db.collection("transactions").doc(txnId).delete();
        } catch (error) {
          console.error(error);
        }
      };

      const handleSaveBudget = async () => {
        try {
          await db.collection("settings").doc("budget").set({ amount: Number(tempBudget) });
          setIsBudgetModalOpen(false);
        } catch (error) {
          console.error(error);
        }
      };


      // KPI Calculations
      const kpiInventory = kpiCategory === "ทั้งหมด" ? inventory : inventory.filter(i => i.category === kpiCategory);
      const kpiTotalTypes = kpiInventory.length;
      const kpiTotalUnits = kpiInventory.reduce((acc, item) => acc + Number(item.stock), 0);
      const kpiTotalValue = kpiInventory.reduce((acc, item) => acc + (Number(item.stock) * Number(item.price)), 0);
      const kpiLowStockCount = kpiInventory.filter(item => Number(item.stock) <= Number(item.reorder) && Number(item.stock) > 0).length;
      const kpiOutOfStockCount = kpiInventory.filter(item => Number(item.stock) === 0).length;
      
      const filteredTxnsByDate = useMemo(() => {
        return transactions.filter(t => {
          if (!t.timestamp) return true;
          const tDate = t.timestamp.slice(0, 10);
          if (startDate && tDate < startDate) return false;
          if (endDate && tDate > endDate) return false;
          return true;
        });
      }, [transactions, startDate, endDate]);

      const periodInQty = filteredTxnsByDate.filter(t => t.type === "รับเข้า").reduce((sum, t) => sum + Number(t.qty), 0);
      const periodOutQty = filteredTxnsByDate.filter(t => t.type === "เบิกออก").reduce((sum, t) => sum + Number(t.qty), 0);
      const periodExpense = filteredTxnsByDate.filter(t => t.type === "รับเข้า").reduce((sum, t) => sum + Number(t.totalCost || 0), 0);

      const currentMonthPrefix = new Date().toISOString().slice(0, 7);
      const currentMonthExpense = transactions
        .filter(t => t.type === "รับเข้า" && t.timestamp && t.timestamp.startsWith(currentMonthPrefix))
        .reduce((sum, t) => sum + Number(t.totalCost || 0), 0);
      const budgetUsagePct = Math.min((currentMonthExpense / monthlyBudget) * 100, 100);
      const isBudgetDanger = budgetUsagePct >= 90;

      const last6Months = useMemo(() => {
        return Array.from({length: 6}, (_, i) => {
          const d = new Date();
          d.setMonth(d.getMonth() - (5 - i));
          return { prefix: d.toISOString().slice(0, 7), label: d.toLocaleDateString('th-TH', { month: 'short', year: '2-digit' }) };
        });
      }, []);

      const monthlyExpenseData = last6Months.map(m => {
        const cost = transactions.filter(t => t.type === "รับเข้า" && t.timestamp && t.timestamp.startsWith(m.prefix)).reduce((sum, t) => sum + Number(t.totalCost || 0), 0);
        return { ...m, cost };
      });
      const maxMonthlyExpense = Math.max(...monthlyExpenseData.map(d => d.cost), 1000);

      const categories = Object.keys(categoryPrefixMap);
      const categoryExpenseStats = categories.map(cat => {
        const items = inventory.filter(i => i.category === cat);
        const expense = filteredTxnsByDate.filter(t => t.type === "รับเข้า" && t.itemName && items.some(i => i.name === t.itemName)).reduce((sum, t) => sum + Number(t.totalCost || 0), 0);
        return { category: cat, expense, icon: categoryIconMap[cat] };
      }).filter(c => c.expense > 0).sort((a, b) => b.expense - a.expense);

      const checkoutTxns = filteredTxnsByDate.filter(t => t.type === "เบิกออก");
      const checkoutItemStats = {};
      checkoutTxns.forEach(t => {
        if (!checkoutItemStats[t.itemId]) { checkoutItemStats[t.itemId] = { id: t.itemId, name: t.itemName, qty: 0, unit: t.unit }; }
        checkoutItemStats[t.itemId].qty += Number(t.qty);
      });
      const topCheckoutItems = Object.values(checkoutItemStats).sort((a, b) => b.qty - a.qty).slice(0, 5);
      const maxCheckoutQty = topCheckoutItems.length > 0 ? topCheckoutItems[0].qty : 1;

      const checkoutCatStats = {};
      categories.forEach(c => checkoutCatStats[c] = { category: c, qty: 0, icon: categoryIconMap[c] });
      checkoutTxns.forEach(t => {
        const item = inventory.find(i => i.id === t.itemId);
        if (item && checkoutCatStats[item.category]) checkoutCatStats[item.category].qty += Number(t.qty);
      });
      const checkoutCatData = Object.values(checkoutCatStats).filter(c => c.qty > 0).sort((a, b) => b.qty - a.qty);
      const totalCheckoutQty = checkoutCatData.reduce((sum, c) => sum + c.qty, 0);

      const filteredInventory = inventory.filter(item => {
        const matchSearch = item.name.toLowerCase().includes(searchTerm.toLowerCase()) || item.id.toLowerCase().includes(searchTerm.toLowerCase()) || (item.location && item.location.toLowerCase().includes(searchTerm.toLowerCase()));
        const matchCat = filterCategory === "ทั้งหมด" || item.category === filterCategory;
        const matchLow = !onlyLowStock || Number(item.stock) <= Number(item.reorder);
        return matchSearch && matchCat && matchLow;
      });

      const filteredTxns = useMemo(() => {
        return transactions.filter(t => {
          const itemMatch = inventory.find(i => i.id === t.itemId);
          const tCat = itemMatch ? itemMatch.category : "";
          const matchCat = txnFilterCategory === "ทั้งหมด" || tCat === txnFilterCategory;
          const matchSearch = t.itemName.toLowerCase().includes(txnSearchTerm.toLowerCase()) || t.itemId.toLowerCase().includes(txnSearchTerm.toLowerCase());
          return matchCat && matchSearch;
        });
      }, [transactions, inventory, txnFilterCategory, txnSearchTerm]);


      const handleImageUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        if (file.size > 3 * 1024 * 1024) { alert("ขนาดไฟล์ใหญ่เกินไป (จำกัด 3MB)"); return; }
        const reader = new FileReader();
        reader.onloadend = () => { setFormData(prev => ({ ...prev, image: reader.result })); };
        reader.readAsDataURL(file);
      };

      const handleAddClick = () => {
        setIsEditing(false);
        const defaultCat = "กระดาษและสิ่งพิมพ์";
        setFormData({ id: generateNextId(defaultCat, inventory), name: "", category: defaultCat, stock: 0, reorder: 5, unit: "ชิ้น", price: 0, location: "", image: "", receivedDate: today });
        setIsAddEditModalOpen(true);
      };

      const handleCategoryChange = (e) => {
        const newCat = e.target.value;
        setFormData(prev => ({ ...prev, category: newCat, id: isEditing ? prev.id : generateNextId(newCat, inventory) }));
      };

      const handleDownloadCSV = () => {
        let csvContent = "\uFEFFรหัสอุปกรณ์ (ID),ชื่ออุปกรณ์,หมวดหมู่,จำนวนคงเหลือ,ราคาต่อหน่วย,มูลค่ารวม,จุดเตือนสั่งซื้อ,หน่วยนับ,สถานที่จัดเก็บ,วันที่นำเข้าล่าสุด\n";
        inventory.forEach(item => {
          const totalVal = item.stock * item.price;
          csvContent += `"${item.id}","${item.name}","${item.category}",${item.stock},${item.price},${totalVal},${item.reorder},"${item.unit}","${item.location || '-'}","${item.receivedDate || '-'}"\n`;
        });
        const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.setAttribute("href", url);
        link.setAttribute("download", `รายงานคลังอุปกรณ์_${new Date().toISOString().slice(0, 10)}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      // 🟢 หน้าจอ Loading ตอนดึงข้อมูล 🟢
      if (isLoading) {
        return (
          <div class="min-h-screen flex flex-col items-center justify-center bg-slate-50 gap-4">
            <div class="w-12 h-12 border-4 border-indigo-600 border-t-transparent rounded-full animate-spin"></div>
            <p class="text-slate-500 font-medium">กำลังโหลดข้อมูลจากฐานข้อมูลคลาวด์...</p>
            {dbError && (
              <p class="text-rose-500 text-sm max-w-sm text-center">เกิดข้อผิดพลาด: โปรดตรวจสอบว่าคุณได้สร้าง Firestore Database และตั้งค่า Rules ใน Firebase เป็น 'true' แล้วหรือยัง</p>
            )}
          </div>
        );
      }

      return (
        <div class="max-w-7xl mx-auto p-4 sm:p-6 lg:p-8 animate-[fadeIn_0.5s_ease-out]">
          {/* Header */}
          <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 bg-white p-5 rounded-2xl shadow-sm border border-slate-200 mb-6">
            <div class="flex items-center gap-3">
              <div class="w-12 h-12 bg-indigo-600 rounded-xl flex items-center justify-center text-white text-2xl font-bold shadow-md shadow-indigo-100">📦</div>
              <div>
                <h1 class="text-xl font-bold text-slate-800">
                  ระบบบันทึกคลังอุปกรณ์ OED 
                  <span class="text-[10px] font-bold uppercase tracking-wider bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded ml-2 align-middle border border-emerald-200">Online</span>
                </h1>
                <p class="text-xs text-slate-500 mt-0.5">เชื่อมต่อฐานข้อมูล Firebase Real-time</p>
              </div>
            </div>
            
            <div class="flex flex-wrap items-center gap-2">
              <button onClick={() => setActiveTab("stock")} class={`px-4 py-2 rounded-xl text-sm font-medium transition ${activeTab === "stock" ? "bg-indigo-600 text-white shadow-sm" : "text-slate-600 hover:bg-slate-100"}`}>สต็อกอุปกรณ์</button>
              <button onClick={() => setActiveTab("txns")} class={`px-4 py-2 rounded-xl text-sm font-medium transition ${activeTab === "txns" ? "bg-indigo-600 text-white shadow-sm" : "text-slate-600 hover:bg-slate-100"}`}>ประวัติทำรายการ</button>

                        <div key={i} class="relative flex flex-col items-center w-full group z-10">
                          <div class="opacity-0 group-hover:opacity-100 absolute -top-8 bg-slate-800 text-white text-[10px] px-2 py-1 rounded pointer-events-none transition-opacity whitespace-nowrap">{formatB(d.cost)}</div>
                          <div class="w-full max-w-[40px] bg-indigo-100 rounded-t-sm flex items-end justify-center h-full relative" style={{ height: '150px' }}><div class="w-full bg-indigo-500 rounded-t-sm transition-all duration-700" style={{ height: `${heightPct}%` }}></div></div>
                          <span class="text-[10px] text-slate-500 mt-2 whitespace-nowrap">{d.label}</span>
                        </div>
                      )
                    })}
                  </div>
                </div>

                <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                  <h3 class="font-bold text-slate-800 mb-1 flex items-center gap-2"><span>📊</span> สัดส่วนค่าใช้จ่ายสั่งซื้อตามหมวดหมู่</h3>
                  <p class="text-xs text-slate-400 mb-5">มูลค่าการสั่งซื้อ(รับเข้า) แบ่งตามประเภท ในช่วงเวลาที่เลือก</p>
                  {categoryExpenseStats.length === 0 ? (
                    <div class="text-center py-10 text-sm text-slate-400">ไม่มีข้อมูลค่าใช้จ่ายในช่วงเวลานี้</div>
                  ) : (
                    <div class="space-y-4">
                      {categoryExpenseStats.map((cat, idx) => {
                        const colors = ["bg-sky-500", "bg-emerald-500", "bg-amber-500", "bg-purple-500", "bg-rose-500"];
                        const color = colors[idx % colors.length];
                        const pct = periodExpense > 0 ? (cat.expense / periodExpense) * 100 : 0;
                        return (
                          <div key={cat.category}>
                            <div class="flex justify-between text-xs font-medium text-slate-700 mb-1"><span class="flex items-center gap-1.5">{cat.icon} {cat.category}</span><span class="font-bold">{formatB(cat.expense)} ({Math.round(pct)}%)</span></div>
                            <div class="w-full bg-slate-100 rounded-full h-3 overflow-hidden"><div class={`${color} h-3 rounded-full transition-all duration-500`} style={{ width: `${pct}%` }}></div></div>
                          </div>
                        );
                      })}
                    </div>
                  )}
                  <div class="mt-5 pt-3 border-t border-slate-100 flex justify-between text-sm"><span class="text-slate-500">รวมค่าใช้จ่ายสั่งซื้อทั้งหมด:</span><span class="font-bold text-slate-800">{formatB(periodExpense)}</span></div>
                </div>
              </div>
            </div>
          )}

          {/* Modal จัดการต่างๆ */}
          {isDetailModalOpen && detailItem && (
            <div class="fixed inset-0 bg-slate-900/60 flex items-center justify-center p-4 z-50 overflow-y-auto">
              <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl relative my-8">
                <button onClick={() => setIsDetailModalOpen(false)} class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 text-xl font-bold">✕</button>
                <div class="flex items-center justify-between border-b border-slate-100 pb-3 mb-4">
                  <h3 class="text-lg font-bold text-slate-800 flex items-center gap-2"><span>📄</span> รายละเอียดอุปกรณ์สำนักงาน</h3>
                  <button onClick={() => { setIsEditing(true); setEditingOldId(detailItem.id); setFormData({ ...detailItem, receivedDate: detailItem.receivedDate || today }); setIsDetailModalOpen(false); setIsAddEditModalOpen(true); }} class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-medium shadow-sm transition">✏️ แก้ไขข้อมูล</button>
                </div>
                <div class="space-y-4">
                  <div class="flex justify-center bg-slate-100 rounded-2xl p-3 border border-slate-200">
                    {detailItem.image ? ( <img src={detailItem.image} alt={detailItem.name} class="max-h-56 w-auto object-contain rounded-xl shadow-sm" /> ) : ( <div class="h-44 w-full flex flex-col items-center justify-center text-slate-400 text-sm"><span class="text-4xl mb-1">📷</span><span>ไม่มีรูปภาพอุปกรณ์</span></div> )}
                  </div>
                  <div class="grid grid-cols-2 gap-3 text-sm bg-slate-50 p-4 rounded-xl border border-slate-100">
                    <div><span class="text-xs text-slate-400 block">รหัสอุปกรณ์ (ID)</span><span class="font-mono font-bold text-slate-700">{detailItem.id}</span></div>
                    <div><span class="text-xs text-slate-400 block">หมวดหมู่</span><span class="font-medium text-slate-700">{detailItem.category}</span></div>
                    <div class="col-span-2"><span class="text-xs text-slate-400 block">ชื่ออุปกรณ์</span><span class="font-bold text-slate-800 text-base">{detailItem.name}</span></div>
                    <div><span class="text-xs text-slate-400 block">จำนวนคงเหลือ</span><span class="text-lg font-bold text-indigo-700">{detailItem.stock} {detailItem.unit}</span></div>
                    <div><span class="text-xs text-slate-400 block">จุดเตือนสั่งซื้อขั้นต่ำ</span><span class="font-medium text-slate-700">{detailItem.reorder} {detailItem.unit}</span></div>
                    <div><span class="text-xs text-slate-400 block">สถานที่จัดเก็บ</span><span class="font-medium text-slate-700">{detailItem.location || "-"}</span></div>
                    <div><span class="text-xs text-slate-400 block">วันที่นำเข้าล่าสุด</span><span class="font-medium text-slate-700">{detailItem.receivedDate ? new Date(detailItem.receivedDate).toLocaleDateString("th-TH") : "-"}</span></div>
                  </div>
                </div>
              </div>
            </div>
          )}

          {isBudgetModalOpen && (
            <div class="fixed inset-0 bg-slate-900/50 flex items-center justify-center p-4 z-50">
              <div class="bg-white rounded-2xl max-w-sm w-full p-6 shadow-xl">
                <h3 class="text-lg font-bold text-slate-800 mb-2">ตั้งงบประมาณรายเดือน</h3>
                <p class="text-xs text-slate-500 mb-4">ระบบจะแจ้งเตือนเมื่อมูลค่าการสั่งซื้อของเดือนปัจจุบันเข้าใกล้งบประมาณที่ตั้งไว้</p>
                <div class="mb-4">
                  <label class="text-xs font-medium text-slate-700 block mb-1">งบประมาณสูงสุดต่อเดือน (บาท)</label>
                  <input type="number" min="1" value={tempBudget} onChange={e => setTempBudget(e.target.value)} class="w-full px-3 py-2 border border-slate-300 rounded-xl text-lg font-bold outline-none focus:ring-2 focus:ring-indigo-500" />
                </div>
                <div class="flex justify-end gap-2">
                  <button onClick={() => setIsBudgetModalOpen(false)} class="px-4 py-2 text-slate-600 text-sm bg-slate-100 rounded-xl hover:bg-slate-200">ยกเลิก</button>
                  <button onClick={handleSaveBudget} class="px-4 py-2 bg-indigo-600 text-white text-sm font-medium rounded-xl hover:bg-indigo-700">บันทึกงบ</button>
                </div>
              </div>
            </div>
          )}

          {isAddEditModalOpen && (
            <div class="fixed inset-0 bg-slate-900/50 flex items-center justify-center p-4 z-50 overflow-y-auto">
              <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl my-8">
                <h3 class="text-lg font-bold text-slate-800 mb-3">{isEditing ? "✏️ แก้ไขข้อมูลอุปกรณ์" : "+ เพิ่มอุปกรณ์ใหม่เข้าสู่ระบบ"}</h3>
                <form onSubmit={handleSaveItem} class="space-y-3.5">
                  <div>
                    <label class="text-xs font-medium text-slate-600 block mb-1">รูปภาพอุปกรณ์</label>
                    <div class="flex items-center gap-3">
                      {formData.image ? (
                        <div class="relative w-16 h-16 rounded-xl overflow-hidden border border-slate-200 shadow-sm flex-shrink-0">
                          <img src={formData.image} alt="พรีวิว" class="w-full h-full object-cover" />
                          <button type="button" onClick={() => setFormData({ ...formData, image: "" })} class="absolute top-0 right-0 bg-rose-600 text-white w-4 h-4 text-xs flex items-center justify-center rounded-bl">✕</button>
                        </div>
                      ) : (
                        <div class="w-16 h-16 rounded-xl bg-slate-100 border border-dashed border-slate-300 flex flex-col items-center justify-center text-slate-400 text-xs flex-shrink-0">📷</div>
                      )}
                      <div class="flex-1"><input type="file" accept="image/*" onChange={handleImageUpload} class="text-[11px] text-slate-500 file:mr-2 file:py-1 file:px-2 file:rounded file:border-0 file:bg-indigo-50 file:text-indigo-700 cursor-pointer" /></div>
                    </div>
                  </div>

                  <div class="grid grid-cols-2 gap-2">
                    <div class="col-span-2">
                      <label class="text-xs font-medium text-slate-600 block mb-1">หมวดหมู่ *</label>
                      <select value={formData.category} onChange={handleCategoryChange} class="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm outline-none bg-white">
                        {Object.keys(categoryPrefixMap).map(cat => <option key={cat} value={cat}>{cat}</option>)}
                      </select>
                    </div>
                  </div>

                  <div>
                    <label class="text-xs font-medium text-slate-700 flex justify-between mb-1"><span>รหัสอุปกรณ์ (ID) *</span> <span class="text-[10px] text-indigo-500">แก้ไขได้</span></label>
                    <input type="text" required value={formData.id} onChange={(e) => setFormData({...formData, id: e.target.value})} class="w-full px-3 py-2 border rounded-xl text-sm font-mono uppercase outline-none" />
                  </div>
                  <div>
                    <label class="text-xs font-medium text-slate-600 block mb-1">ชื่ออุปกรณ์ *</label>
                    <input type="text" required value={formData.name} onChange={(e) => setFormData({...formData, name: e.target.value})} class="w-full px-3 py-2 border rounded-xl text-sm outline-none" />
                  </div>
                  <div class="grid grid-cols-2 gap-2">
                    <div class="col-span-2">
                      <label class="text-xs font-medium text-slate-600 block mb-1">ราคาต้นทุน/หน่วย (บาท) - สำหรับอ้างอิงตอนรับเข้า</label>
                      <input type="number" min="0" step="0.01" value={formData.price} onChange={(e) => setFormData({...formData, price: e.target.value})} class="w-full px-3 py-2 border rounded-xl text-sm outline-none" />
                    </div>
                  </div>
                  <div class="grid grid-cols-3 gap-2">
                    <div><label class="text-xs font-medium text-slate-600 block mb-1">คงเหลือ</label><input type="number" required min="0" value={formData.stock} onChange={(e) => setFormData({...formData, stock: e.target.value})} class="w-full px-3 py-2 border rounded-xl text-sm outline-none" /></div>
                    <div><label class="text-xs font-medium text-slate-600 block mb-1">หน่วยนับ</label><input type="text" required value={formData.unit} onChange={(e) => setFormData({...formData, unit: e.target.value})} class="w-full px-3 py-2 border rounded-xl text-sm outline-none" placeholder="ด้าม" /></div>
                    <div><label class="text-xs font-medium text-slate-600 block mb-1">จุดเตือน</label><input type="number" required min="1" value={formData.reorder} onChange={(e) => setFormData({...formData, reorder: e.target.value})} class="w-full px-3 py-2 border rounded-xl text-sm outline-none" /></div>
                  </div>

                  <div class="flex justify-end gap-2 pt-3 border-t border-slate-100">
                    <button type="button" onClick={() => setIsAddEditModalOpen(false)} class="px-4 py-2 text-slate-600 text-sm hover:bg-slate-100 rounded-xl">ยกเลิก</button>
                    <button type="submit" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium rounded-xl">บันทึกข้อมูล</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {isActionModalOpen && selectedItem && (
            <div class="fixed inset-0 bg-slate-900/50 flex items-center justify-center p-4 z-50">
              <div class="bg-white rounded-2xl max-w-sm w-full p-6 shadow-xl">
                <div class="flex items-center gap-3 mb-3">
                  {selectedItem.image ? ( <img src={selectedItem.image} alt={selectedItem.name} class="w-12 h-12 rounded-xl object-cover border border-slate-200" /> ) : ( <div class="w-12 h-12 rounded-xl bg-slate-100 flex items-center justify-center text-xl">📦</div> )}
                  <div><h3 class="text-base font-bold text-slate-800">{actionType === "out" ? "📦 เบิกอุปกรณ์ออกจากคลัง" : "📥 รับอุปกรณ์เข้าสู่คลัง"}</h3><p class="text-[11px] text-slate-500 font-medium">{selectedItem.name}</p></div>
                </div>

                <form onSubmit={handleTransactionSubmit} class="space-y-3.5">
                  <div>
                    <label class="text-xs font-medium text-slate-700 block mb-1">วัน/เวลาที่ทำรายการ *</label>
                    <input type="datetime-local" required value={actionDate} onChange={(e) => setActionDate(e.target.value)} class="w-full px-3 py-2 border rounded-xl text-sm outline-none" />
                  </div>

                  <div class="grid grid-cols-2 gap-3">
                    <div>
                      <label class="text-xs font-medium text-slate-700 block mb-1">จำนวน ({selectedItem.unit}) *</label>
                      <input type="number" required min="1" max={actionType === "out" ? selectedItem.stock : 9999} value={actionQty} onChange={(e) => setActionQty(e.target.value)} class="w-full px-3 py-2 border rounded-xl text-base font-bold outline-none" />
                    </div>
                    {actionType === "in" && (
                      <div>
                        <label class="text-xs font-medium text-slate-700 block mb-1">ราคา/หน่วย (ล็อตนี้)</label>
                        <input type="number" min="0" step="0.01" value={actionPrice} onChange={(e) => setActionPrice(e.target.value)} class={`w-full px-3 py-2 border rounded-xl text-sm outline-none ${Number(actionPrice) > selectedItem.price ? 'border-rose-300 bg-rose-50 text-rose-700' : ''}`} />
                        {Number(actionPrice) > selectedItem.price && <p class="text-[9px] text-rose-600 mt-1 leading-tight">⚠️ แพงกว่าเดิม ({formatB(selectedItem.price)})</p>}
                      </div>
                    )}
                    {actionType === "out" && (
                      <div>
                        <label class="text-xs font-medium text-slate-700 block mb-1">ผู้ทำรายการ *</label>
                        <input type="text" required value={actionUser} onChange={(e) => setActionUser(e.target.value)} class="w-full px-3 py-2 border rounded-xl text-sm outline-none" placeholder="ชื่อ/แผนก" />
                      </div>
                    )}
                  </div>
                  
                  {actionType === "in" && (
                    <div class="bg-indigo-50 border border-indigo-100 p-2 rounded-xl text-right flex items-center justify-between">
                      <span class="text-xs font-bold text-indigo-700">ยอดรวมสั่งซื้อ:</span>
                      <span class="text-lg font-bold text-indigo-900">{formatB(Number(actionQty) * Number(actionPrice))}</span>
                    </div>
                  )}

                  {actionType === "in" && (
                    <div>
                      <label class="text-xs font-medium text-slate-700 block mb-1">ผู้ทำรายการ *</label>
                      <input type="text" required value={actionUser} onChange={(e) => setActionUser(e.target.value)} class="w-full px-3 py-2 border rounded-xl text-sm outline-none" placeholder="ชื่อ-นามสกุล" />
                    </div>
                  )}

                  <div>
                    <label class="text-xs font-medium text-slate-700 block mb-1">หมายเหตุ</label>
                    <textarea rows="2" value={actionNote} onChange={(e) => setActionNote(e.target.value)} class="w-full px-3 py-2 border rounded-xl text-sm outline-none resize-none" placeholder="ข้อมูลเพิ่มเติม..."></textarea>
                  </div>

                  <div class="flex justify-end gap-2 pt-2 border-t border-slate-100">
                    <button type="button" onClick={() => setIsActionModalOpen(false)} class="px-4 py-2 text-slate-600 text-sm bg-slate-100 hover:bg-slate-200 rounded-xl">ยกเลิก</button>
                    <button type="submit" class={`px-4 py-2 text-white text-sm font-medium rounded-xl shadow-sm ${actionType === "out" ? "bg-amber-600 hover:bg-amber-700" : "bg-emerald-600 hover:bg-emerald-700"}`}>
                      ยืนยัน{actionType === "out" ? "เบิกออก" : "รับเข้า"}
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById("root"));
  </script>
</body>
</html>
